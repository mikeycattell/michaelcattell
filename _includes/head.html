<head>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YW00TW1WQH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-YW00TW1WQH');
  </script>


  <!-- Basic page setup -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">


  <!-- Page title -->
  <title>{% if page.url == "/" %}Mikey Cattell - Principal Interaction & Product Designer{% elsif page.title %}{{ page.title | escape }} - Mikey Cattell{% else %}{{ site.title | escape }}{% endif %}</title>


  <!-- Meta description -->
  <meta
    name="description"
    content="{% if page.description %}{{ page.description | strip_html | strip_newlines | escape }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}{% else %}{{ site.description | escape }}{% endif %}"
  >


  <!-- Styles -->
  <link
    rel="stylesheet"
    href="{{ '/css/styles.css' | relative_url }}"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  >

  <link
    rel="stylesheet"
    href="https://use.fontawesome.com/releases/v5.7.2/css/all.css"
    integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr"
    crossorigin="anonymous"
  >


  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>


  <!-- Canonical URL -->
  <link
    rel="canonical"
    href="{{ page.url | absolute_url }}"
  >


  <!-- RSS -->
  <link
    rel="alternate"
    type="application/rss+xml"
    title="{{ site.title | escape }}"
    href="{{ '/feed.xml' | absolute_url }}"
  >


  <!-- Favicon -->
  <link
    rel="shortcut icon"
    href="{{ '/favicon.ico' | relative_url }}"
    type="image/x-icon"
  >


  <!-- Open Graph -->
  <meta
    property="og:site_name"
    content="Mikey Cattell"
  >

  <meta
    property="og:type"
    content="{% if page.layout == 'post' %}article{% else %}website{% endif %}"
  >

  <meta
    property="og:title"
    content="{% if page.url == "/" %}Mikey Cattell - Principal Interaction & Product Designer{% elsif page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}"
  >

  <meta
    property="og:description"
    content="{% if page.description %}{{ page.description | strip_html | strip_newlines | escape }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}{% else %}{{ site.description | escape }}{% endif %}"
  >

  <meta
    property="og:url"
    content="{{ page.url | absolute_url }}"
  >

  <meta
    property="og:image"
    content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ '/mikeycattell.jpg' | absolute_url }}{% endif %}"
  >


  <!-- Twitter / social sharing -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="{% if page.url == "/" %}Mikey Cattell - Principal Interaction & Product Designer{% elsif page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}"
  >

  <meta
    name="twitter:description"
    content="{% if page.description %}{{ page.description | strip_html | strip_newlines | escape }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}{% else %}{{ site.description | escape }}{% endif %}"
  >

  <meta
    name="twitter:image"
    content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ '/mikeycattell.jpg' | absolute_url }}{% endif %}"
  >

</head>
